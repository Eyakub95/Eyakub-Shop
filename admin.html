<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eyakub-Shop Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout {
      background: #e53935;
      color: white;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .save {
      background: #111;
      color: white;
      width: 100%;
    }

    .cancel {
      background: #777;
      color: white;
      margin-top: 8px;
      width: 100%;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .product img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .product-info {
      flex: 1;
    }

    .product-info h3 {
      margin: 0 0 5px;
    }

    .price {
      font-weight: bold;
      margin: 5px 0;
    }

    .edit {
      background: #1976d2;
      color: white;
      margin-right: 5px;
    }

    .delete {
      background: #e53935;
      color: white;
    }

    #loginBox {
      max-width: 400px;
      margin: 80px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
    }

    #loginBox button {
      width: 100%;
      background: #111;
      color: white;
    }

    #message {
      margin: 10px 0;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }

    @media(max-width:600px) {
      .product {
        flex-direction: column;
        align-items: flex-start;
      }

      .product img {
        width: 100%;
        height: 180px;
      }
    }
  </style>
</head>

<body>

<header id="adminHeader" class="hidden">
  <h1>🛒 Eyakub-Shop Admin</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div id="loginBox">
  <h2>Admin Login</h2>

  <input id="email" type="email" placeholder="Admin Email">

  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div id="loginMessage"></div>
</div>

<div id="adminPanel" class="container hidden">

  <div class="card">
    <h2 id="formTitle">Add Product</h2>

    <input id="productName" placeholder="Product Name">

    <input id="productPrice" type="number" placeholder="Price">

    <input id="productImage" placeholder="Image URL">

    <textarea id="productDescription" placeholder="Product Description"></textarea>

    <button class="save" onclick="saveProduct()">Add Product</button>

    <button id="cancelBtn" class="cancel hidden" onclick="cancelEdit()">
      Cancel Edit
    </button>

    <div id="message"></div>
  </div>

  <div class="card">
    <h2>All Products</h2>
    <div id="products">Loading...</div>
  </div>

</div>

<script>
const SUPABASE_URL = "https://clgysoxpxapznjpaphjn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_--Www4z8S9xmhkS97i3yXg_jQtZ7kVk";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let editingId = null;

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const msg = document.getElementById("loginMessage");
  msg.textContent = "Logging in...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    msg.textContent = "Login failed: " + error.message;
    return;
  }

  await checkAdmin();
}

async function checkAdmin() {
  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    showLogin();
    return;
  }

  const { data, error } = await supabaseClient
    .from("admins")
    .select("is_admin")
    .eq("id", user.id)
    .eq("is_admin", true)
    .maybeSingle();

  if (error || !data) {
    await supabaseClient.auth.signOut();
    alert("Access denied. You are not an admin.");
    showLogin();
    return;
  }

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminHeader").classList.remove("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");

  loadProducts();
}

function showLogin() {
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("adminHeader").classList.add("hidden");
  document.getElementById("adminPanel").classList.add("hidden");
}

async function logout() {
  await supabaseClient.auth.signOut();
  showLogin();
}

async function loadProducts() {
  const box = document.getElementById("products");

  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    box.innerHTML = "<p>Error loading products: " + error.message + "</p>";
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = "<p>No products yet.</p>";
    return;
  }

  box.innerHTML = data.map(product => `
    <div class="product">

      <img src="${escapeHtml(product.image_url || "")}"
           onerror="this.style.display='none'">

      <div class="product-info">
        <h3>${escapeHtml(product.name)}</h3>

        <div class="price">
          Price: ${escapeHtml(String(product.price))}
        </div>

        <div>
          ${escapeHtml(product.description || "")}
        </div>

        <br>

        <button class="edit"
          onclick='editProduct(${JSON.stringify(product)})'>
          Edit
        </button>

        <button class="delete"
          onclick="deleteProduct('${product.id}')">
          Delete
        </button>
      </div>

    </div>
  `).join("");
}

async function saveProduct() {
  const name = document.getElementById("productName").value.trim();
  const price = document.getElementById("productPrice").value;
  const image_url = document.getElementById("productImage").value.trim();
  const description =
    document.getElementById("productDescription").value.trim();

  const msg = document.getElementById("message");

  if (!name || !price) {
    msg.textContent = "Product name and price are required.";
    return;
  }

  let result;

  if (editingId) {
    result = await supabaseClient
      .from("products")
      .update({
        name,
        price: Number(price),
        image_url,
        description
      })
      .eq("id", editingId);
  } else {
    result = await supabaseClient
      .from("products")
      .insert({
        name,
        price: Number(price),
        image_url,
        description
      });
  }

  if (result.error) {
    msg.textContent = "Error: " + result.error.message;
    return;
  }

  msg.textContent = editingId
    ? "Product updated successfully!"
    : "Product added successfully!";

  clearForm();
  loadProducts();
}

function editProduct(product) {
  editingId = product.id;

  document.getElementById("productName").value = product.name || "";
  document.getElementById("productPrice").value = product.price || "";
  document.getElementById("productImage").value = product.image_url || "";
  document.getElementById("productDescription").value =
    product.description || "";

  document.getElementById("formTitle").textContent = "Edit Product";
  document.querySelector(".save").textContent = "Update Product";
  document.getElementById("cancelBtn").classList.remove("hidden");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function cancelEdit() {
  clearForm();
}

function clearForm() {
  editingId = null;

  document.getElementById("productName").value = "";
  document.getElementById("productPrice").value = "";
  document.getElementById("productImage").value = "";
  document.getElementById("productDescription").value = "";

  document.getElementById("formTitle").textContent = "Add Product";
  document.querySelector(".save").textContent = "Add Product";
  document.getElementById("cancelBtn").classList.add("hidden");
}

async function deleteProduct(id) {
  if (!confirm("Are you sure you want to delete this product?")) {
    return;
  }

  const { error } = await supabaseClient
    .from("products")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Delete failed: " + error.message);
    return;
  }

  loadProducts();
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

supabaseClient.auth.getSession().then(({ data }) => {
  if (data.session) {
    checkAdmin();
  }
});
</script>

</body>
</html>
