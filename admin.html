<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eyakub-Shop Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.hidden{
  display:none !important;
}

/* LOGIN */

.login-page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.login-box h1{
  text-align:center;
  margin-top:0;
}

.login-box p{
  text-align:center;
  color:#777;
}

input,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
  margin-bottom:12px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  border:none;
  border-radius:8px;
  padding:12px 18px;
  font-size:15px;
  cursor:pointer;
}

.login-btn{
  width:100%;
  background:#111827;
  color:white;
}

.message{
  margin-top:15px;
  padding:10px;
  border-radius:7px;
  display:none;
}

.error{
  display:block;
  background:#fee2e2;
  color:#b91c1c;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

/* HEADER */

.header{
  background:#111827;
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h2{
  margin:0;
}

.logout{
  background:#dc2626;
  color:white;
}

/* CONTENT */

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  padding:22px;
  margin-bottom:20px;
  border-radius:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.card h2{
  margin-top:0;
}

/* BUTTONS */

.add-btn{
  width:100%;
  background:#111827;
  color:white;
}

.cancel-btn{
  width:100%;
  background:#6b7280;
  color:white;
  margin-top:8px;
}

/* PRODUCTS */

.search{
  margin-bottom:20px;
}

.product{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  display:flex;
  gap:15px;
  align-items:center;
}

.product-image{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
  flex-shrink:0;
}

.product-info{
  flex:1;
}

.product-info h3{
  margin:0 0 8px;
}

.price{
  font-weight:bold;
  font-size:18px;
  margin-bottom:8px;
}

.description{
  color:#666;
  margin-bottom:12px;
}

.edit-btn{
  background:#2563eb;
  color:white;
  margin-right:5px;
}

.delete-btn{
  background:#dc2626;
  color:white;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

/* MOBILE */

@media(max-width:600px){

  .header{
    padding:14px;
  }

  .header h2{
    font-size:18px;
  }

  .product{
    flex-direction:column;
    align-items:stretch;
  }

  .product-image{
    width:100%;
    height:200px;
  }

  .edit-btn,
  .delete-btn{
    width:100%;
    margin:4px 0;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login-page">

  <div class="login-box">

    <h1>🛒 Eyakub-Shop</h1>

    <p>Admin Panel Login</p>

    <input
      id="loginEmail"
      type="email"
      placeholder="Admin Email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button
      class="login-btn"
      onclick="login()"
    >
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminPage" class="hidden">

  <div class="header">

    <h2>🛒 Eyakub-Shop Admin</h2>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <div class="container">

    <!-- PRODUCT FORM -->

    <div class="card">

      <h2 id="formTitle">
        ➕ Add Product
      </h2>

      <input
        id="productName"
        type="text"
        placeholder="Product Name"
      >

      <input
        id="productPrice"
        type="number"
        step="0.01"
        placeholder="Product Price"
      >

      <input
        id="productImage"
        type="text"
        placeholder="Product Image URL"
      >

      <textarea
        id="productDescription"
        placeholder="Product Description"
      ></textarea>

      <button
        id="saveButton"
        class="add-btn"
        onclick="saveProduct()"
      >
        ➕ Add Product
      </button>

      <button
        id="cancelButton"
        class="cancel-btn hidden"
        onclick="cancelEdit()"
      >
        Cancel Edit
      </button>

      <div
        id="productMessage"
        class="message"
      ></div>

    </div>


    <!-- ALL PRODUCTS -->

    <div class="card">

      <h2>📦 All Products</h2>

      <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="🔎 Search products..."
        oninput="filterProducts()"
      >

      <div id="products">
        <div class="loading">
          Loading products...
        </div>
      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://clgysoxpxapznjpaphjn.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_--Www4z8S9xmhkS97i3yXg_jQtZ7kVk";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let editingId = null;
let allProducts = [];


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");


  if(!email || !password){

    showMessage(
      message,
      "Please enter email and password.",
      "error"
    );

    return;
  }


  showMessage(
    message,
    "Logging in...",
    "success"
  );


  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if(error){

    showMessage(
      message,
      "Login failed: " + error.message,
      "error"
    );

    return;
  }


  await checkAdmin();

}


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(){

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();


  if(!user){

    showLogin();

    return;
  }


  const { data, error } =
    await supabaseClient
      .from("admins")
      .select("id,is_admin")
      .eq("id", user.id)
      .eq("is_admin", true)
      .maybeSingle();


  if(error){

    console.error(error);

    await supabaseClient.auth.signOut();

    showLoginMessage(
      "Admin verification failed: " + error.message
    );

    return;
  }


  if(!data){

    await supabaseClient.auth.signOut();

    showLoginMessage(
      "Access denied. This account is not an admin."
    );

    return;
  }


  document
    .getElementById("loginPage")
    .classList.add("hidden");


  document
    .getElementById("adminPage")
    .classList.remove("hidden");


  loadProducts();

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("adminPage")
    .classList.add("hidden");

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  editingId = null;

  clearForm();

  showLogin();

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

  const box =
    document.getElementById("products");


  box.innerHTML =
    '<div class="loading">Loading products...</div>';


  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("created_at", {
        ascending:false
      });


  if(error){

    box.innerHTML =
      '<div class="message error">' +
      'Error loading products: ' +
      escapeHtml(error.message) +
      '</div>';

    return;
  }


  allProducts = data || [];

  displayProducts(allProducts);

}


/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts(products){

  const box =
    document.getElementById("products");


  if(!products.length){

    box.innerHTML =
      '<div class="empty">📦 No products found.</div>';

    return;
  }


  box.innerHTML =
    products.map(product => {

      const image =
        product.image_url || "";


      return `

        <div class="product">

          <img
            class="product-image"
            src="${escapeHtml(image)}"
            onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'"
          >

          <div class="product-info">

            <h3>
              ${escapeHtml(product.name)}
            </h3>

            <div class="price">
              Price: ${escapeHtml(String(product.price))}
            </div>

            <div class="description">
              ${escapeHtml(product.description || "")}
            </div>

            <button
              class="edit-btn"
              onclick="editProduct('${product.id}')"
            >
              ✏️ Edit
            </button>

            <button
              class="delete-btn"
              onclick="deleteProduct('${product.id}')"
            >
              🗑️ Delete
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =====================================================
   ADD / UPDATE PRODUCT
===================================================== */

async function saveProduct(){

  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const price =
    document
      .getElementById("productPrice")
      .value;


  const image_url =
    document
      .getElementById("productImage")
      .value
      .trim();


  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();


  const message =
    document.getElementById("productMessage");


  if(!name){

    showMessage(
      message,
      "Product name is required.",
      "error"
    );

    return;
  }


  if(!price){

    showMessage(
      message,
      "Product price is required.",
      "error"
    );

    return;
  }


  const saveButton =
    document.getElementById("saveButton");


  saveButton.disabled = true;

  saveButton.textContent =
    editingId
      ? "Updating..."
      : "Adding...";


  let result;


  /* UPDATE */

  if(editingId){

    result =
      await supabaseClient
        .from("products")
        .update({
          name: name,
          price: Number(price),
          image_url: image_url,
          description: description
        })
        .eq("id", editingId);

  }

  /* ADD */

  else{

    result =
      await supabaseClient
        .from("products")
        .insert({
          name: name,
          price: Number(price),
          image_url: image_url,
          description: description
        });

  }


  saveButton.disabled = false;

  saveButton.textContent =
    editingId
      ? "✏️ Update Product"
      : "➕ Add Product";


  if(result.error){

    console.error(result.error);

    showMessage(
      message,
      "Error: " + result.error.message,
      "error"
    );

    return;
  }


  showMessage(
    message,
    editingId
      ? "✅ Product updated successfully!"
      : "✅ Product added successfully!",
    "success"
  );


  clearForm();

  await loadProducts();

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id){

  const product =
    allProducts.find(
      item => item.id === id
    );


  if(!product) return;


  editingId = id;


  document
    .getElementById("productName")
    .value =
      product.name || "";


  document
    .getElementById("productPrice")
    .value =
      product.price || "";


  document
    .getElementById("productImage")
    .value =
      product.image_url || "";


  document
    .getElementById("productDescription")
    .value =
      product.description || "";


  document
    .getElementById("formTitle")
    .textContent =
      "✏️ Edit Product";


  document
    .getElementById("saveButton")
    .textContent =
      "✏️ Update Product";


  document
    .getElementById("cancelButton")
    .classList
    .remove("hidden");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit(){

  clearForm();

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

  editingId = null;


  document
    .getElementById("productName")
    .value = "";


  document
    .getElementById("productPrice")
    .value = "";


  document
    .getElementById("productImage")
    .value = "";


  document
    .getElementById("productDescription")
    .value = "";


  document
    .getElementById("formTitle")
    .textContent =
      "➕ Add Product";


  document
    .getElementById("saveButton")
    .textContent =
      "➕ Add Product";


  document
    .getElementById("cancelButton")
    .classList
    .add("hidden");

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

  const product =
    allProducts.find(
      item => item.id === id
    );


  if(!product) return;


  const confirmDelete =
    confirm(
      "Delete this product?\n\n" +
      product.name
    );


  if(!confirmDelete) return;


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if(error){

    alert(
      "Delete failed: " +
      error.message
    );

    return;
  }


  await loadProducts();

}


/* =====================================================
   SEARCH
===================================================== */

function filterProducts(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  if(!search){

    displayProducts(allProducts);

    return;
  }


  const filtered =
    allProducts.filter(product => {

      return (
        (product.name || "")
          .toLowerCase()
          .includes(search)
        ||
        (product.description || "")
          .toLowerCase()
          .includes(search)
      );

    });


  displayProducts(filtered);

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(element,text,type){

  element.textContent = text;

  element.className =
    "message " + type;

}


function showLoginMessage(text){

  const message =
    document.getElementById("loginMessage");

  showMessage(
    message,
    text,
    "error"
  );

}


/* =====================================================
   SECURITY HTML ESCAPE
===================================================== */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   AUTO LOGIN
===================================================== */

supabaseClient.auth
  .getSession()
  .then(({data}) => {

    if(data.session){

      checkAdmin();

    }

  });


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth
  .onAuthStateChange(
    (event, session) => {

      if(event === "SIGNED_OUT"){

        showLogin();

      }

    }
  );

</script>

</body>
</html>
