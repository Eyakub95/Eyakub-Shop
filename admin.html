<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eyakub-Shop Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  color:#111;
}

header{
  background:#111827;
  color:white;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:22px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  cursor:pointer;
  font-size:15px;
}

.logout{
  background:#ef4444;
  color:white;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  margin-bottom:22px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.full{
  grid-column:1 / -1;
}

.image-box{
  border:2px dashed #cbd5e1;
  padding:20px;
  border-radius:10px;
  background:#f8fafc;
}

.preview{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}

.preview img{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #ddd;
}

.options{
  display:flex;
  gap:25px;
  flex-wrap:wrap;
  margin-top:15px;
}

.options label{
  font-weight:normal;
}

.options input{
  width:auto;
}

.save{
  width:100%;
  margin-top:20px;
  background:#111827;
  color:white;
  font-size:17px;
}

.cancel{
  width:100%;
  margin-top:10px;
  background:#6b7280;
  color:white;
}

.message{
  margin-top:15px;
  font-weight:bold;
}

.product{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
  display:flex;
  gap:18px;
  align-items:flex-start;
}

.product-images{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  width:180px;
  flex-shrink:0;
}

.product-images img{
  width:82px;
  height:82px;
  object-fit:cover;
  border-radius:8px;
}

.product-info{
  flex:1;
}

.product-info h3{
  margin:0 0 8px;
}

.price{
  font-size:18px;
  font-weight:bold;
  margin:5px 0;
}

.old-price{
  text-decoration:line-through;
  color:#777;
  margin-right:8px;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:5px;
  background:#dcfce7;
  color:#166534;
  font-size:12px;
  margin:3px;
}

.edit{
  background:#2563eb;
  color:white;
  margin-right:5px;
}

.delete{
  background:#dc2626;
  color:white;
}

#loginBox{
  max-width:420px;
  margin:90px auto;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 3px 20px rgba(0,0,0,.1);
}

#loginBox input{
  margin-bottom:15px;
}

.login-btn{
  width:100%;
  background:#111827;
  color:white;
}

.hidden{
  display:none!important;
}

.loading{
  padding:20px;
  text-align:center;
}

@media(max-width:700px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .product{
    flex-direction:column;
  }

  .product-images{
    width:100%;
  }

  .product-images img{
    width:100px;
    height:100px;
  }
}
</style>
</head>

<body>

<header id="adminHeader" class="hidden">
  <h1>🛒 Eyakub-Shop Admin</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>


<!-- LOGIN -->

<div id="loginBox">

  <h2>🔐 Admin Login</h2>

  <input
    id="email"
    type="email"
    placeholder="Admin Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button class="login-btn" onclick="login()">
    Login
  </button>

  <div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel" class="container hidden">

  <div class="card">

    <h2 id="formTitle">➕ Add Product</h2>

    <div class="form-grid">

      <div>
        <label>Product Name *</label>
        <input id="productName" placeholder="Example: Fashion Sneakers">
      </div>

      <div>
        <label>Category</label>
        <input id="category" placeholder="Shoes">
      </div>

      <div>
        <label>Brand</label>
        <input id="brand" placeholder="Fashion">
      </div>

      <div>
        <label>SKU</label>
        <input id="sku" placeholder="SH-001">
      </div>

      <div>
        <label>Previous Price</label>
        <input id="previousPrice" type="number" placeholder="300">
      </div>

      <div>
        <label>Current Price *</label>
        <input id="price" type="number" placeholder="250">
      </div>

      <div>
        <label>Stock</label>
        <input id="stock" type="number" placeholder="10">
      </div>

      <div>
        <label>Color</label>
        <input id="color" placeholder="White / Red">
      </div>

      <div>
        <label>Size</label>
        <input id="size" placeholder="40, 41, 42, 43">
      </div>

      <div class="full">

        <label>Product Images</label>

        <div class="image-box">

          <input
            id="imageFiles"
            type="file"
            accept="image/*"
            multiple
            onchange="previewImages(event)"
          >

          <div>
            আপনি একসাথে একাধিক ছবি নির্বাচন করতে পারবেন।
          </div>

          <div id="imagePreview" class="preview"></div>

        </div>

      </div>

      <div class="full">

        <label>Description</label>

        <textarea
          id="description"
          placeholder="Write product description..."
        ></textarea>

      </div>

    </div>


    <div class="options">

      <label>
        <input type="checkbox" id="isSale">
        Sale Product
      </label>

      <label>
        <input type="checkbox" id="isFeatured">
        Featured Product
      </label>

      <label>
        <input type="checkbox" id="isActive" checked>
        Active Product
      </label>

    </div>


    <button class="save" onclick="saveProduct()">
      ➕ Add Product
    </button>

    <button
      id="cancelBtn"
      class="cancel hidden"
      onclick="cancelEdit()"
    >
      Cancel Edit
    </button>

    <div id="message" class="message"></div>

  </div>


  <!-- PRODUCTS -->

  <div class="card">

    <h2>📦 All Products</h2>

    <input
      id="search"
      placeholder="🔍 Search products..."
      oninput="filterProducts()"
    >

    <div id="products" class="loading">
      Loading...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://txlzoefmytbgacwnomnk.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_ohuA86YijZlkQ_H_CJANeA_zZ6S3lT4";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


let editingId = null;
let allProducts = [];


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const msg =
    document.getElementById("loginMessage");

  if(!email || !password){

    msg.textContent =
      "Email and password দিন।";

    return;
  }

  msg.textContent = "Logging in...";

  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    msg.textContent =
      "Login failed: " + error.message;

    return;
  }

  await checkAdmin();
}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

  const {
    data:{user}
  } = await supabaseClient.auth.getUser();

  if(!user){

    showLogin();

    return;
  }


  const {data,error} =
    await supabaseClient
      .from("admins")
      .select("id,is_admin")
      .eq("id",user.id)
      .eq("is_admin",true)
      .maybeSingle();


  if(error || !data){

    await supabaseClient.auth.signOut();

    alert(
      "Access denied. This account is not an admin."
    );

    showLogin();

    return;
  }


  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("adminHeader")
    .classList.remove("hidden");

  document
    .getElementById("adminPanel")
    .classList.remove("hidden");


  loadProducts();
}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document
    .getElementById("adminHeader")
    .classList.add("hidden");

  document
    .getElementById("adminPanel")
    .classList.add("hidden");
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  showLogin();
}


/* =========================
   IMAGE PREVIEW
========================= */

function previewImages(event){

  const files =
    Array.from(event.target.files);

  const preview =
    document.getElementById("imagePreview");

  preview.innerHTML = "";


  files.forEach(file => {

    const reader =
      new FileReader();

    reader.onload = function(e){

      const img =
        document.createElement("img");

      img.src = e.target.result;

      preview.appendChild(img);
    };

    reader.readAsDataURL(file);

  });
}


/* =========================
   UPLOAD IMAGES
========================= */

async function uploadImages(files){

  const urls = [];

  for(let i=0;i<files.length;i++){

    const file = files[i];

    const extension =
      file.name.split(".").pop();

    const fileName =
      Date.now() +
      "-" +
      Math.random().toString(36).substring(2) +
      "." +
      extension;

    const filePath =
      "products/" + fileName;


    const {error} =
      await supabaseClient.storage
        .from("product-images")
        .upload(
          filePath,
          file,
          {
            cacheControl:"3600",
            upsert:false
          }
        );


    if(error){

      throw error;
    }


    const {data} =
      supabaseClient.storage
        .from("product-images")
        .getPublicUrl(filePath);


    urls.push(data.publicUrl);
  }


  return urls;
}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

  const msg =
    document.getElementById("message");


  const name =
    document.getElementById("productName")
      .value.trim();

  const category =
    document.getElementById("category")
      .value.trim();

  const brand =
    document.getElementById("brand")
      .value.trim();

  const sku =
    document.getElementById("sku")
      .value.trim();

  const previousPrice =
    document.getElementById("previousPrice")
      .value;

  const price =
    document.getElementById("price")
      .value;

  const stock =
    document.getElementById("stock")
      .value || 0;

  const color =
    document.getElementById("color")
      .value.trim();

  const size =
    document.getElementById("size")
      .value.trim();

  const description =
    document.getElementById("description")
      .value.trim();

  const isSale =
    document.getElementById("isSale")
      .checked;

  const isFeatured =
    document.getElementById("isFeatured")
      .checked;

  const isActive =
    document.getElementById("isActive")
      .checked;


  if(!name){

    msg.textContent =
      "❌ Product Name দিন।";

    return;
  }


  if(!price){

    msg.textContent =
      "❌ Current Price দিন।";

    return;
  }


  msg.textContent =
    "⏳ Saving product...";


  try{

    let imageUrls = [];


    /* নতুন ছবি */

    const fileInput =
      document.getElementById("imageFiles");

    const files =
      Array.from(fileInput.files);


    if(files.length > 0){

      msg.textContent =
        "⏳ Uploading images...";

      imageUrls =
        await uploadImages(files);
    }


    /* Edit হলে পুরোনো ছবি রাখবে */

    if(editingId && imageUrls.length === 0){

      const oldProduct =
        allProducts.find(
          p => p.id === editingId
        );

      imageUrls =
        oldProduct?.images || [];

      if(
        imageUrls.length === 0 &&
        oldProduct?.image_url
      ){

        imageUrls =
          [oldProduct.image_url];
      }
    }


    const productData = {

      name:name,

      category:category || null,

      brand:brand || null,

      sku:sku || null,

      previous_price:
        previousPrice
        ? Number(previousPrice)
        : null,

      price:Number(price),

      stock:Number(stock),

      color:color || null,

      size:size || null,

      image_url:
        imageUrls.length
        ? imageUrls[0]
        : null,

      images:
        imageUrls.length
        ? imageUrls
        : [],

      description:
        description || null,

      is_sale:isSale,

      is_featured:isFeatured,

      is_active:isActive
    };


    let result;


    if(editingId){

      result =
        await supabaseClient
          .from("products")
          .update(productData)
          .eq("id",editingId);

    }else{

      result =
        await supabaseClient
          .from("products")
          .insert(productData);
    }


    if(result.error){

      throw result.error;
    }


    msg.textContent =
      editingId
      ? "✅ Product updated successfully!"
      : "✅ Product added successfully!";


    clearForm();

    loadProducts();

  }catch(error){

    console.error(error);

    msg.textContent =
      "❌ Error: " + error.message;
  }
}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const box =
    document.getElementById("products");

  box.innerHTML =
    "Loading...";


  const {data,error} =
    await supabaseClient
      .from("products")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    box.innerHTML =
      "❌ Error: " + error.message;

    return;
  }


  allProducts =
    data || [];


  displayProducts(allProducts);
}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(products){

  const box =
    document.getElementById("products");


  if(!products.length){

    box.innerHTML =
      "<p>No products found.</p>";

    return;
  }


  box.innerHTML =
    products.map(product => {

      let imgs =
        product.images || [];

      if(
        imgs.length === 0 &&
        product.image_url
      ){

        imgs = [product.image_url];
      }


      const imageHTML =
        imgs.map(url => `
          <img
            src="${escapeHtml(url)}"
            onerror="this.style.display='none'"
          >
        `).join("");


      return `

        <div class="product">

          <div class="product-images">

            ${imageHTML}

          </div>


          <div class="product-info">

            <h3>
              ${escapeHtml(product.name)}
            </h3>

            <div>

              ${
                product.brand
                ? "Brand: " +
                  escapeHtml(product.brand)
                : ""
              }

              ${
                product.category
                ? " | Category: " +
                  escapeHtml(product.category)
                : ""
              }

            </div>


            <div class="price">

              ${
                product.previous_price
                ? `<span class="old-price">
                    ${product.previous_price}
                   </span>`
                : ""
              }

              ${product.price}

            </div>


            <div>
              Stock: ${product.stock || 0}
            </div>


            ${
              product.size
              ? `<div>
                  Size: ${escapeHtml(product.size)}
                 </div>`
              : ""
            }


            ${
              product.color
              ? `<div>
                  Color: ${escapeHtml(product.color)}
                 </div>`
              : ""
            }


            <p>
              ${escapeHtml(
                product.description || ""
              )}
            </p>


            ${
              product.is_sale
              ? `<span class="badge">
                   SALE
                 </span>`
              : ""
            }


            ${
              product.is_featured
              ? `<span class="badge">
                   FEATURED
                 </span>`
              : ""
            }


            ${
              product.is_active
              ? `<span class="badge">
                   ACTIVE
                 </span>`
              : `<span class="badge">
                   INACTIVE
                 </span>`
            }


            <br><br>


            <button
              class="edit"
              onclick="editProduct('${product.id}')"
            >
              ✏️ Edit
            </button>


            <button
              class="delete"
              onclick="deleteProduct('${product.id}')"
            >
              🗑️ Delete
            </button>

          </div>

        </div>

      `;

    }).join("");
}


/* =========================
   EDIT
========================= */

function editProduct(id){

  const product =
    allProducts.find(
      p => p.id === id
    );

  if(!product) return;


  editingId = id;


  document.getElementById("productName").value =
    product.name || "";

  document.getElementById("category").value =
    product.category || "";

  document.getElementById("brand").value =
    product.brand || "";

  document.getElementById("sku").value =
    product.sku || "";

  document.getElementById("previousPrice").value =
    product.previous_price || "";

  document.getElementById("price").value =
    product.price || "";

  document.getElementById("stock").value =
    product.stock || 0;

  document.getElementById("color").value =
    product.color || "";

  document.getElementById("size").value =
    product.size || "";

  document.getElementById("description").value =
    product.description || "";

  document.getElementById("isSale").checked =
    !!product.is_sale;

  document.getElementById("isFeatured").checked =
    !!product.is_featured;

  document.getElementById("isActive").checked =
    product.is_active !== false;


  document.getElementById("formTitle")
    .textContent =
    "✏️ Edit Product";


  document.querySelector(".save")
    .textContent =
    "💾 Update Product";


  document.getElementById("cancelBtn")
    .classList.remove("hidden");


  document.getElementById("imagePreview")
    .innerHTML = "";


  const imgs =
    product.images || [];


  imgs.forEach(url => {

    const img =
      document.createElement("img");

    img.src = url;

    document
      .getElementById("imagePreview")
      .appendChild(img);

  });


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

  clearForm();
}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

  editingId = null;


  document.getElementById("productName").value = "";

  document.getElementById("category").value = "";

  document.getElementById("brand").value = "";

  document.getElementById("sku").value = "";

  document.getElementById("previousPrice").value = "";

  document.getElementById("price").value = "";

  document.getElementById("stock").value = "";

  document.getElementById("color").value = "";

  document.getElementById("size").value = "";

  document.getElementById("description").value = "";


  document.getElementById("isSale").checked = false;

  document.getElementById("isFeatured").checked = false;

  document.getElementById("isActive").checked = true;


  document.getElementById("imageFiles").value = "";

  document.getElementById("imagePreview").innerHTML = "";


  document.getElementById("formTitle")
    .textContent =
    "➕ Add Product";


  document.querySelector(".save")
    .textContent =
    "➕ Add Product";


  document.getElementById("cancelBtn")
    .classList.add("hidden");
}


/* =========================
   DELETE
========================= */

async function deleteProduct(id){

  if(
    !confirm(
      "এই Product টি Delete করতে চান?"
    )
  ){

    return;
  }


  const {error} =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      "Delete failed: " +
      error.message
    );

    return;
  }


  loadProducts();
}


/* =========================
   SEARCH
========================= */

function filterProducts(){

  const search =
    document.getElementById("search")
      .value
      .toLowerCase();


  const filtered =
    allProducts.filter(product =>

      (
        product.name +
        " " +
        (product.brand || "") +
        " " +
        (product.category || "") +
        " " +
        (product.sku || "")
      )
      .toLowerCase()
      .includes(search)

    );


  displayProducts(filtered);
}


/* =========================
   SECURITY HTML
========================= */

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================
   AUTO LOGIN CHECK
========================= */

supabaseClient.auth
  .getSession()
  .then(({data}) => {

    if(data.session){

      checkAdmin();

    }

  });

</script>

</body>
</html>
